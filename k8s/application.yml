infra:
  db:
    host: postgres
    port: 5432
    name: app_db
  redis:
    host: redis
    port: 6379
  zipkin:
    endpoint: http://zipkin:9411/api/v2/spans

spring:
  application:
    name: personal-service

  datasource:
    url: jdbc:postgresql://${infra.db.host}:${infra.db.port}/${infra.db.name}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${infra.redis.host}
      port: ${infra.redis.port}
      password: ${REDIS_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${infra.zipkin.endpoint}